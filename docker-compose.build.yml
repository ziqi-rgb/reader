# Use with: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  reader:
    image: reader:local
    pull_policy: never
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # Base image mirror override (see .env); Docker Hub direct is slow/blocked here.
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
